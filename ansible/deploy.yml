---
# ==============================================================================
# Ansible Playbook for Automated Deployment & Idempotency Verification (US-016)
# ==============================================================================
- name: Deploy Research Paper Repository Container
  hosts: webservers
  become: false
  gather_facts: false

  vars:
    app_image: "muawiyah123/research-paper-repository:latest"
    container_name: "research-paper-repository"
    app_port: 8081

  tasks:
    - name: Ensure Docker service is installed and accessible
      command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Display Docker availability status
      debug:
        msg: "Docker engine status: {{ docker_check.stdout | default('Docker CLI not available') }}"

    - name: Ensure application deployment directory exists
      file:
        path: /opt/research-paper-repository
        state: directory
        mode: '0755'
      become: true
      ignore_errors: true

    - name: Ensure application container is running with desired configuration
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ app_image }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ app_port }}:8081"
        env:
          SERVER_PORT: "8081"
          SPRING_PROFILES_ACTIVE: "prod"
        healthcheck:
          test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/"]
          interval: 30s
          timeout: 5s
          retries: 3
          start_period: 20s
      when: docker_check.rc == 0
      register: container_run

    - name: Verify application endpoint responsiveness (AC-016-1)
      uri:
        url: "http://localhost:{{ app_port }}/"
        status_code: 200
        timeout: 10
      register: app_health
      until: app_health.status == 200
      retries: 5
      delay: 5
      when: docker_check.rc == 0

    - name: Summary of idempotent deployment state
      debug:
        msg: "Deployment verified successfully. Idempotent state: container state maintained."
